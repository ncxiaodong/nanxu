---
layout: default
---

<meta name="robots" content="noindex">

<section class="post-page">
  <div class="post-container">
    <article class="post-article">
      <h1>{{ page.title | remove: " - 公众号" | remove: " - 头条号" | remove: " - 小红书" | remove: " - 抖音" | remove: " - 知乎" | remove: " - 百家号" | remove: " - 58同城" }}</h1>
      <div class="post-meta">
        <span>📅 {{ page.date | date: "%Y年%m月%d日" }}</span>
        {% if page.categories %}<span>📂 {{ page.categories }}</span>{% endif %}
      </div>
      <div class="post-content">
        {{ content }}
      </div>
      <a href="/" class="post-back">← 返回首页</a>
    </article>
  </div>
</section>
