---
permalink: /:title/
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; line-height: 1.6; }
    h1 { color: #2c3e50; }
    .meta { color: #7f8c8d; font-size: 0.9em; }
    .content { margin-top: 20px; }
    .back-link { display: inline-block; margin-top: 30px; color: #3498db; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
    footer { margin-top: 50px; padding-top: 20px; border-top: 1px solid #ecf0f1; color: #7f8c8d; }
  </style>
</head>
<body>
  <h1>{{ page.title }}</h1>
  <div class="meta">{{ page.date | date: "%Y年%m月%d日" }}</div>
  <div class="content">
    {{ content }}
  </div>
  <a href="/" class="back-link">← 返回首页</a>
  <footer>
    <p>南序先生 | 辉旭为简 | 有问题找南序</p>
  </footer>
</body>
</html>
