<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | 南序工作室</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}南序先生 | 辉旭为简工作室 - 专业办公效率提升、弱电施工、AI智能体、系统维保服务{% endif %}">
  {% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #333; line-height: 1.6; background: #fff;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; height: auto; }

    /* ===== Navigation ===== */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(26,58,92,0.95); backdrop-filter: blur(10px);
      padding: 0 40px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      transition: background 0.3s; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .nav-brand {
      font-size: 1.15em; font-weight: 700; color: #fff;
      display: flex; align-items: center; gap: 8px;
    }
    .nav-brand .dot { width: 8px; height: 8px; background: #e67e22; border-radius: 50%; display: inline-block; }
    .nav-links { display: flex; align-items: center; gap: 8px; }
    .nav-links a {
      color: rgba(255,255,255,0.8); font-size: 0.9em; padding: 8px 16px;
      border-radius: 6px; transition: all 0.2s; font-weight: 500;
    }
    .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .nav-links .btn-contact {
      background: #e67e22; color: #fff; padding: 8px 20px; border-radius: 6px;
    }
    .nav-links .btn-contact:hover { background: #d35400; }

    /* ===== Hero ===== */
    .hero {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0f263b 0%, #1a3a5c 30%, #2c5f8a 60%, #3a7bb5 100%);
      color: #fff; text-align: center; padding: 120px 20px 80px;
      position: relative; overflow: hidden;
    }
    .hero::before {
      content: ''; position: absolute; top: -50%; right: -30%;
      width: 600px; height: 600px; background: radial-gradient(circle, rgba(230,126,34,0.08) 0%, transparent 70%);
      border-radius: 50%;
    }
    .hero::after {
      content: ''; position: absolute; bottom: -30%; left: -20%;
      width: 500px; height: 500px; background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
      border-radius: 50%;
    }
    .hero-content { position: relative; z-index: 1; max-width: 800px; }
    .hero-badge {
      display: inline-block; background: rgba(230,126,34,0.2); color: #e67e22;
      padding: 6px 18px; border-radius: 20px; font-size: 0.85em; font-weight: 600;
      margin-bottom: 24px; border: 1px solid rgba(230,126,34,0.3);
    }
    .hero h1 { font-size: 3em; font-weight: 800; margin-bottom: 8px; letter-spacing: 2px; }
    .hero .subtitle { font-size: 1.3em; color: rgba(255,255,255,0.85); margin-bottom: 8px; font-weight: 300; }
    .hero .slogan { font-size: 1.15em; color: rgba(255,255,255,0.7); margin-bottom: 36px; line-height: 1.8; }
    .hero-btns { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .hero-btns .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 36px; background: #e67e22; color: #fff;
      border-radius: 8px; font-size: 1.05em; font-weight: 600;
      transition: all 0.3s; border: none; cursor: pointer;
    }
    .hero-btns .btn-primary:hover { background: #d35400; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(230,126,34,0.3); }
    .hero-btns .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 36px; background: transparent; color: #fff;
      border-radius: 8px; font-size: 1.05em; font-weight: 500;
      border: 2px solid rgba(255,255,255,0.3); transition: all 0.3s;
    }
    .hero-btns .btn-secondary:hover { border-color: #e67e22; background: rgba(230,126,34,0.1); transform: translateY(-2px); }
    .hero-stats {
      display: flex; justify-content: center; gap: 60px; margin-top: 50px;
      padding-top: 40px; border-top: 1px solid rgba(255,255,255,0.1);
    }
    .hero-stat { text-align: center; }
    .hero-stat .num { font-size: 2em; font-weight: 800; color: #e67e22; }
    .hero-stat .label { font-size: 0.85em; color: rgba(255,255,255,0.6); margin-top: 4px; }

    /* ===== Section Common ===== */
    section { padding: 80px 40px; }
    .section-title { text-align: center; margin-bottom: 50px; }
    .section-title h2 { font-size: 2em; color: #1a3a5c; font-weight: 700; margin-bottom: 12px; }
    .section-title p { color: #888; font-size: 1.05em; max-width: 600px; margin: 0 auto; }
    .section-title .bar { width: 50px; height: 3px; background: #e67e22; margin: 16px auto 0; border-radius: 2px; }
    .container { max-width: 1100px; margin: 0 auto; }

    /* ===== Services ===== */
    .services { background: #f5f7fa; }
    .service-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .service-card {
      background: #fff; border-radius: 12px; padding: 32px 28px;
      transition: all 0.3s; border: 1px solid #e8ecf0; cursor: pointer;
      position: relative; overflow: hidden;
    }
    .service-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: #2c5f8a; transform: scaleX(0); transform-origin: left;
      transition: transform 0.3s;
    }
    .service-card:hover { transform: translateY(-6px); box-shadow: 0 12px 40px rgba(26,58,92,0.1); border-color: transparent; }
    .service-card:hover::before { transform: scaleX(1); }
    .service-card .icon { font-size: 2.2em; margin-bottom: 16px; display: block; }
    .service-card h3 { font-size: 1.15em; color: #1a3a5c; margin-bottom: 10px; font-weight: 700; }
    .service-card p { color: #777; font-size: 0.9em; line-height: 1.7; }
    .service-card .tag {
      display: inline-block; margin-top: 14px; color: #2c5f8a; font-size: 0.85em; font-weight: 600;
      transition: color 0.2s;
    }
    .service-card:hover .tag { color: #e67e22; }

    /* ===== Why Us ===== */
    .advantages { background: #fff; }
    .adv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
    .adv-card { text-align: center; padding: 40px 24px; border-radius: 12px; transition: all 0.3s; }
    .adv-card:hover { background: #f5f7fa; }
    .adv-card .icon-wrap {
      width: 70px; height: 70px; border-radius: 50%; margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center; font-size: 1.8em;
    }
    .adv-card:nth-child(1) .icon-wrap { background: rgba(44,95,138,0.1); }
    .adv-card:nth-child(2) .icon-wrap { background: rgba(230,126,34,0.1); }
    .adv-card:nth-child(3) .icon-wrap { background: rgba(26,58,92,0.1); }
    .adv-card h3 { font-size: 1.15em; color: #1a3a5c; margin-bottom: 10px; font-weight: 700; }
    .adv-card p { color: #777; font-size: 0.9em; line-height: 1.7; max-width: 280px; margin: 0 auto; }

    /* ===== Cases ===== */
    .cases { background: #f5f7fa; }
    .case-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .case-card {
      background: #fff; border-radius: 12px; overflow: hidden;
      transition: all 0.3s; border: 1px solid #e8ecf0;
    }
    .case-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(26,58,92,0.1); }
    .case-img {
      height: 180px; background: linear-gradient(135deg, #1a3a5c, #2c5f8a);
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.3); font-size: 3em;
    }
    .case-img:nth-child(1) { background: linear-gradient(135deg, #1a3a5c, #2c5f8a); }
    .case-body { padding: 20px 24px 24px; }
    .case-body .cat { font-size: 0.8em; color: #e67e22; font-weight: 600; margin-bottom: 6px; }
    .case-body h3 { font-size: 1.05em; color: #1a3a5c; margin-bottom: 8px; font-weight: 700; }
    .case-body p { color: #888; font-size: 0.88em; line-height: 1.6; margin-bottom: 14px; }
    .case-body .btn-case {
      display: inline-flex; align-items: center; gap: 6px;
      color: #2c5f8a; font-size: 0.88em; font-weight: 600; transition: color 0.2s;
    }
    .case-body .btn-case:hover { color: #e67e22; }

    /* ===== Contact ===== */
    .contact {
      background: linear-gradient(135deg, #0f263b, #1a3a5c); color: #fff; text-align: center;
    }
    .contact .section-title h2 { color: #fff; }
    .contact .section-title p { color: rgba(255,255,255,0.6); }
    .contact .section-title .bar { background: #e67e22; }
    .contact-info { display: flex; justify-content: center; gap: 50px; flex-wrap: wrap; margin-top: 10px; }
    .contact-item { text-align: center; }
    .contact-item .ci-icon { font-size: 2em; margin-bottom: 12px; display: block; }
    .contact-item .ci-label { font-size: 0.85em; color: rgba(255,255,255,0.5); margin-bottom: 6px; }
    .contact-item .ci-value { font-size: 1.2em; font-weight: 600; color: #fff; }
    .contact-item .ci-value a { color: #e67e22; transition: color 0.2s; }
    .contact-item .ci-value a:hover { color: #f39c12; }
    .contact-item .ci-tel { font-size: 1.5em; font-weight: 800; color: #e67e22; letter-spacing: 1px; }
    .contact-cta { margin-top: 40px; }
    .contact-cta .btn-contact-cta {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 40px; background: #e67e22; color: #fff;
      border-radius: 8px; font-size: 1.05em; font-weight: 600;
      transition: all 0.3s;
    }
    .contact-cta .btn-contact-cta:hover { background: #d35400; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(230,126,34,0.3); }

    /* ===== Footer ===== */
    .footer {
      background: #0a1a2e; color: rgba(255,255,255,0.4); text-align: center;
      padding: 40px 20px 30px; font-size: 0.85em;
    }
    .footer-brand { font-size: 1.1em; font-weight: 700; color: rgba(255,255,255,0.7); margin-bottom: 8px; }
    .footer-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 16px; flex-wrap: wrap; }
    .footer-links a { color: rgba(255,255,255,0.4); transition: color 0.2s; }
    .footer-links a:hover { color: #e67e22; }
    .footer .copyright { color: rgba(255,255,255,0.25); }
    .footer .slogan-foot { color: rgba(230,126,34,0.5); margin-top: 6px; font-size: 0.9em; }

    /* ===== Post Page ===== */
    .post-page { padding-top: 100px; min-height: 100vh; background: #f5f7fa; }
    .post-container { max-width: 800px; margin: 0 auto; padding: 0 20px 60px; }
    .post-article {
      background: #fff; border-radius: 12px; padding: 50px; box-shadow: 0 2px 20px rgba(0,0,0,0.04);
    }
    .post-article h1 { font-size: 1.8em; color: #1a3a5c; margin-bottom: 12px; line-height: 1.4; }
    .post-article .post-meta { color: #999; font-size: 0.9em; padding-bottom: 24px; margin-bottom: 30px; border-bottom: 1px solid #eee; }
    .post-article .post-meta span { margin-right: 16px; }
    .post-article .post-content { font-size: 1.02em; line-height: 1.9; color: #444; }
    .post-article .post-content h2 { font-size: 1.4em; color: #1a3a5c; margin: 30px 0 12px; }
    .post-article .post-content h3 { font-size: 1.2em; color: #2c5f8a; margin: 24px 0 10px; }
    .post-article .post-content p { margin-bottom: 16px; }
    .post-article .post-content ul, .post-article .post-content ol { margin: 12px 0 16px 24px; }
    .post-article .post-content li { margin-bottom: 8px; }
    .post-article .post-content blockquote { border-left: 4px solid #e67e22; padding: 14px 20px; margin: 16px 0; background: #fef9f4; color: #666; border-radius: 0 6px 6px 0; }
    .post-article .post-content img { border-radius: 8px; margin: 20px 0; }
    .post-article .post-content strong { color: #1a3a5c; }
    .post-article .post-back {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 30px; padding: 10px 24px; background: #2c5f8a; color: #fff;
      border-radius: 6px; font-size: 0.9em; transition: background 0.2s;
    }
    .post-article .post-back:hover { background: #1a3a5c; }

    /* ===== Responsive ===== */
    @media (max-width: 900px) {
      .service-grid, .adv-grid, .case-grid { grid-template-columns: repeat(2, 1fr); }
      .hero-stats { gap: 30px; }
    }
    @media (max-width: 700px) {
      .nav { padding: 0 16px; }
      .nav-links a { padding: 6px 10px; font-size: 0.82em; }
      .nav-links .btn-contact { padding: 6px 14px; }
      section { padding: 50px 20px; }
      .hero h1 { font-size: 2em; }
      .hero .subtitle { font-size: 1em; }
      .hero-stats { gap: 20px; flex-wrap: wrap; }
      .hero-stat .num { font-size: 1.5em; }
      .service-grid, .adv-grid, .case-grid { grid-template-columns: 1fr; }
      .section-title h2 { font-size: 1.6em; }
      .contact-info { flex-direction: column; gap: 24px; }
      .post-article { padding: 24px; }
      .post-article h1 { font-size: 1.4em; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <a href="/" class="nav-brand">
      <span class="dot"></span>
      南序先生 | 辉旭为简
    </a>
    <div class="nav-links">
      <a href="/">首页</a>
      <a href="/#services">服务</a>
      <a href="/#cases">案例</a>
      <a href="/#contact" class="btn-contact">联系</a>
    </div>
  </nav>

  {{ content }}

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-brand">南序先生 | 辉旭为简工作室</div>
    <div class="footer-links">
      <a href="/">首页</a>
      <a href="/#services">服务</a>
      <a href="/#cases">案例</a>
      <a href="/#contact">联系</a>
    </div>
    <div class="copyright">© 2026 辉旭为简工作室 | 有问题找南序</div>
    <div class="slogan-foot">把重复工作交给南序先生，你专注核心业务</div>
  </footer>

  <script>
    // 导航栏滚动效果
    const nav = document.querySelector('.nav');
    let lastScroll = 0;
    window.addEventListener('scroll', function() {
      const currentScroll = window.pageYOffset;
      if (currentScroll > 100) {
        nav.style.background = 'rgba(26,58,92,0.98)';
      } else {
        nav.style.background = 'rgba(26,58,92,0.95)';
      }
      lastScroll = currentScroll;
    });

    // 平滑滚动到各section
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });

    // 服务卡片点击跳转到联系
    document.querySelectorAll('.service-card').forEach(card => {
      card.addEventListener('click', function() {
        const contact = document.querySelector('#contact');
        if (contact) contact.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });

    // 案例卡片点击
    document.querySelectorAll('.case-card .btn-case').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        const contact = document.querySelector('#contact');
        if (contact) contact.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  </script>
</body>
</html>
