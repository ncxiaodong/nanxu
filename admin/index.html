<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南序官网管理后台</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 24px; color: #1a1a2e; margin-bottom: 20px; }
        h2 { font-size: 18px; color: #1a1a2e; margin: 25px 0 12px 0; padding-bottom: 8px; border-bottom: 2px solid #e8e8e8; }
        .hidden { display: none !important; }
        .login-container { max-width: 400px; margin: 80px auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); text-align: center; }
        .login-container h2 { border: none; margin-bottom: 20px; }
        .login-container input { width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 16px; outline: none; }
        .login-container input:focus { border-color: #4a6cf7; }
        .login-container button { width: 100%; padding: 12px; background: #4a6cf7; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .login-container button:hover { background: #3b5de7; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: #fff; padding: 16px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .stat-card .label { font-size: 13px; color: #888; margin-bottom: 4px; }
        .stat-card .value { font-size: 22px; font-weight: 700; color: #1a1a2e; }
        .date-range { background: #fff; padding: 12px 16px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .date-range label { font-size: 14px; color: #555; }
        .date-range input[type="date"] { padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .date-range button { padding: 6px 16px; border: none; border-radius: 6px; background: #4a6cf7; color: #fff; cursor: pointer; font-size: 14px; }
        .date-range button:hover { background: #3b5de7; }
        .date-range button.reset-btn { background: #888; }
        .date-range button.reset-btn:hover { background: #666; }
        .table-wrapper { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow-x: auto; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background: #f8f9fa; padding: 10px 12px; text-align: left; font-weight: 600; color: #555; border-bottom: 2px solid #e8e8e8; white-space: nowrap; }
        td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
        tr:hover td { background: #f8f9ff; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .tag-cn { background: #e8f5e9; color: #2e7d32; }
        .tag-us { background: #e3f2fd; color: #1565c0; }
        .tag-other { background: #f3e5f5; color: #7b1fa2; }
        .device-desktop { color: #1565c0; }
        .device-mobile { color: #e65100; }
        .ip-lookup { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); text-align: center; margin-bottom: 20px; }
        .ip-lookup button { padding: 10px 24px; background: #4a6cf7; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
        .ip-lookup button:hover { background: #3b5de7; }
        .ip-lookup .result { margin-top: 15px; text-align: left; max-width: 500px; margin-left: auto; margin-right: auto; background: #f8f9fa; padding: 16px; border-radius: 8px; display: none; }
        .ip-lookup .result p { margin: 4px 0; font-size: 14px; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: #fff; margin: 15% auto; padding: 24px; border-radius: 12px; max-width: 450px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .modal-content h3 { margin-bottom: 16px; }
        .modal-content input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; margin-bottom: 12px; }
        .modal-content button { padding: 8px 20px; background: #4a6cf7; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        .loading { color: #888; padding: 20px; text-align: center; }
        .error { color: #d32f2f; padding: 20px; text-align: center; }
        .empty { color: #999; padding: 30px; text-align: center; font-size: 15px; }
        .clickable { cursor: pointer; }
        .clickable:hover { text-decoration: underline; color: #4a6cf7; }
    </style>
</head>
<body>
<div class="container">
    <h1 id="mainTitle">南序官网后台管理系统</h1>

    <!-- 登录界面 -->
    <div id="loginSection" class="login-container">
        <h2>管理员登录</h2>
        <form id="loginForm">
            <input type="password" id="passwordInput" placeholder="请输入密码" required>
            <button type="submit">进入后台</button>
        </form>
        <p id="loginError" style="color: red; display: none; margin-top: 10px;">密码错误！</p>
    </div>

    <!-- 后台内容 -->
    <div id="dashboardSection" class="hidden">

        <!-- 日期范围选择 -->
        <div class="date-range">
            <label>日期范围：</label>
            <input type="date" id="startDate">
            <span>至</span>
            <input type="date" id="endDate">
            <button onclick="loadVisitRecords()">查询</button>
            <button class="reset-btn" onclick="resetDateRange()">重置</button>
            <span id="visitCount" style="margin-left: auto; font-size: 13px; color: #888;"></span>
        </div>

        <!-- 访问统计 -->
        <h2>访问统计概览</h2>
        <div class="stats-grid" id="stats">
            <div class="stat-card"><div class="label">总访问量</div><div class="value" id="statTotal">-</div></div>
            <div class="stat-card"><div class="label">独立访客</div><div class="value" id="statUnique">-</div></div>
            <div class="stat-card"><div class="label">今日访问</div><div class="value" id="statToday">-</div></div>
            <div class="stat-card"><div class="label">中国访客</div><div class="value" id="statCN">-</div></div>
            <div class="stat-card"><div class="label">美国访客</div><div class="value" id="statUS">-</div></div>
            <div class="stat-card"><div class="label">其他地区</div><div class="value" id="statOther">-</div></div>
        </div>

        <!-- 热门页面 -->
        <h2>热门页面 TOP5</h2>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>页面</th><th>访问次数</th></tr></thead>
                <tbody id="topPagesBody"></tbody>
            </table>
        </div>

        <!-- 来源渠道 -->
        <h2>来源渠道</h2>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>来源</th><th>访问次数</th></tr></thead>
                <tbody id="referrerBody"></tbody>
            </table>
        </div>

        <!-- 设备分布 -->
        <h2>设备分布</h2>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>设备类型</th><th>访问次数</th></tr></thead>
                <tbody id="deviceBody"></tbody>
            </table>
        </div>

        <!-- 详细访问记录 -->
        <h2>详细访问记录</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>IP</th>
                        <th>归属地</th>
                        <th>页面</th>
                        <th>来源</th>
                        <th>设备</th>
                        <th>系统</th>
                        <th>语言</th>
                    </tr>
                </thead>
                <tbody id="visitsBody"></tbody>
            </table>
        </div>

        <!-- 联系表单记录 -->
        <h2>联系表单记录</h2>
        <div class="table-wrapper">
            <table id="contactsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>姓名</th>
                        <th>邮箱</th>
                        <th>电话</th>
                        <th>公司</th>
                        <th>消息摘要</th>
                        <th>时间</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- IP 查询 -->
        <h2>IP 归属地查询</h2>
        <div class="ip-lookup">
            <input type="text" id="ipInput" placeholder="输入 IP 地址 (如：59.53.32.231)" style="width: 300px; padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; margin-right: 10px;">
            <button onclick="fetchIpInfo()">查询</button>
            <div id="ipResult" class="result"></div>
        </div>

    </div>
</div>

<script>
const API_BASE = '/api';
const PASSWORD = 'hckx-188826';

// 日期工具
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function daysAgo(n) { const d = new Date(); d.setDate(d.getDate()-n); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

// 初始化日期
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('startDate').value = daysAgo(30);
    document.getElementById('endDate').value = todayStr();
});

// 登录
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const pw = document.getElementById('passwordInput').value;
    if (pw === PASSWORD) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');
        document.getElementById('mainTitle').innerText = '南序官网后台管理系统 - 已登录';
        await loadAllData();
    } else {
        document.getElementById('loginError').style.display = 'block';
    }
});

async function loadAllData() {
    await Promise.all([
        loadStats(),
        loadVisitRecords(),
        loadContacts()
    ]);
}

// 加载统计概览
async function loadStats() {
    try {
        const r = await fetch(API_BASE + '/visits/stats');
        const d = await r.json();
        if (d.success) {
            document.getElementById('statTotal').textContent = d.total_visits || 0;
            document.getElementById('statUnique').textContent = d.unique_visitors || 0;
            document.getElementById('statToday').textContent = d.today_visits || 0;
            // 地区分布统计
            let cn = 0, us = 0, other = 0;
            (d.region_distribution || []).forEach(r => {
                if (r.country === 'CN') cn = r.count;
                else if (r.country === 'US') us = r.count;
                else other += r.count;
            });
            document.getElementById('statCN').textContent = cn;
            document.getElementById('statUS').textContent = us;
            document.getElementById('statOther').textContent = other;
            // 热门页面
            const topBody = document.getElementById('topPagesBody');
            if (d.top_pages && d.top_pages.length > 0) {
                topBody.innerHTML = d.top_pages.map(p => '<tr><td>' + p.page + '</td><td>' + p.count + '</td></tr>').join('');
            } else {
                topBody.innerHTML = '<tr><td colspan="2" class="empty">暂无数据</td></tr>';
            }
            // 来源
            const refBody = document.getElementById('referrerBody');
            if (d.referrer_sources && d.referrer_sources.length > 0) {
                refBody.innerHTML = d.referrer_sources.map(r => '<tr><td>' + (r.source || '直接访问') + '</td><td>' + r.count + '</td></tr>').join('');
            } else {
                refBody.innerHTML = '<tr><td colspan="2" class="empty">暂无数据</td></tr>';
            }
            // 设备
            const devBody = document.getElementById('deviceBody');
            if (d.device_distribution && d.device_distribution.length > 0) {
                devBody.innerHTML = d.device_distribution.map(dd => '<tr><td>' + dd.device + '</td><td>' + dd.count + '</td></tr>').join('');
            } else {
                devBody.innerHTML = '<tr><td colspan="2" class="empty">暂无数据</td></tr>';
            }
        }
    } catch(e) {
        console.error('Stats error:', e);
    }
}

// 加载详细访问记录
async function loadVisitRecords() {
    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;
    const tbody = document.getElementById('visitsBody');
    tbody.innerHTML = '<tr><td colspan="8" class="loading">加载中...</td></tr>';

    try {
        const r = await fetch(API_BASE + '/visits/list?start=' + start + '&end=' + end);
        const d = await r.json();
        document.getElementById('visitCount').textContent = '共 ' + (d.count || 0) + ' 条记录';

        if (d.success && d.visits && d.visits.length > 0) {
            tbody.innerHTML = d.visits.map(v => {
                const time = v.timestamp ? new Date(v.timestamp).toLocaleString('zh-CN') : '-';
                const page = v.page_url || '-';
                const ref = v.referrer || '-';
                const lang = v.language || '-';
                // IP 归属地 - 自动查询
                let location = '-';
                if (v.country === 'CN') location = '中国';
                else if (v.country === 'US') location = '美国';
                else if (v.country) location = v.country;
                // 设备判断
                const isMobile = v.screen_width && v.screen_width < 768;
                const device = isMobile ? '移动端' : '桌面端';
                // 系统判断
                const ua = v.user_agent || '';
                let os = '未知';
                if (ua.includes('Windows')) os = 'Windows';
                else if (ua.includes('Mac OS') || ua.includes('macOS')) os = 'macOS';
                else if (ua.includes('Linux')) os = 'Linux';
                else if (ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';
                else if (ua.includes('Android')) os = 'Android';

                const countryTag = v.country === 'CN' ? 'tag-cn' : (v.country === 'US' ? 'tag-us' : 'tag-other');

                return '<tr>' +
                    '<td>' + time + '</td>' +
                    '<td style="font-family:monospace;font-size:13px;">' + v.ip + '</td>' +
                    '<td><span class="tag ' + countryTag + '">' + location + '</span></td>' +
                    '<td>' + page + '</td>' +
                    '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + ref + '">' + ref + '</td>' +
                    '<td class="' + (isMobile ? 'device-mobile' : 'device-desktop') + '">' + device + '</td>' +
                    '<td>' + os + '</td>' +
                    '<td>' + lang + '</td>' +
                '</tr>';
            }).join('');
        } else {
            tbody.innerHTML = '<tr><td colspan="8" class="empty">没有数据</td></tr>';
        }
    } catch(e) {
        tbody.innerHTML = '<tr><td colspan="8" class="error">加载失败：' + e.message + '</td></tr>';
    }
}

// 复位日期
function resetDateRange() {
    document.getElementById('startDate').value = daysAgo(30);
    document.getElementById('endDate').value = todayStr();
    loadVisitRecords();
}

// 加载联系表单
async function loadContacts() {
    try {
        const r = await fetch(API_BASE + '/form');
        const d = await r.json();
        const tbody = document.querySelector('#contactsTable tbody');
        if (d.success && d.contacts && d.contacts.length > 0) {
            tbody.innerHTML = d.contacts.map(row => {
                const msg = row.message ? row.message.substring(0, 30) + (row.message.length > 30 ? '...' : '') : '-';
                const time = row.timestamp ? new Date(row.timestamp).toLocaleString('zh-CN') : '-';
                return '<tr>' +
                    '<td>' + (row.id || '-') + '</td>' +
                    '<td>' + (row.name || '-') + '</td>' +
                    '<td>' + (row.email || '-') + '</td>' +
                    '<td>' + (row.phone || '-') + '</td>' +
                    '<td>' + (row.company || '-') + '</td>' +
                    '<td>' + msg + '</td>' +
                    '<td>' + time + '</td>' +
                '</tr>';
            }).join('');
        } else {
            tbody.innerHTML = '<tr><td colspan="7" class="empty">没有数据</td></tr>';
        }
    } catch(e) {
        document.querySelector('#contactsTable tbody').innerHTML = '<tr><td colspan="7" class="error">加载失败</td></tr>';
    }
}

// IP 归属地查询
async function fetchIpInfo() {
    const ip = document.getElementById('ipInput').value.trim();
    const resultDiv = document.getElementById('ipResult');
    if (!ip) { alert('请输入 IP 地址！'); return; }
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = '<p>正在查询...</p>';
    try {
        const r = await fetch('https://ip-api.com/json/' + ip);
        const d = await r.json();
        if (d.status === 'success') {
            resultDiv.innerHTML = '<p><strong>IP：</strong>' + d.query + '</p>' +
                '<p><strong>国家：</strong>' + d.country + ' (' + d.countryCode + ')</p>' +
                '<p><strong>地区：</strong>' + d.regionName + ' / ' + d.city + '</p>' +
                '<p><strong>时区：</strong>' + d.timezone + '</p>' +
                '<p><strong>ISP：</strong>' + d.isp + '</p>' +
                '<p><strong>组织：</strong>' + d.org + '</p>';
        } else {
            resultDiv.innerHTML = '<p style="color:red;">查询失败：无效的 IP 地址</p>';
        }
    } catch(e) {
        resultDiv.innerHTML = '<p style="color:red;">网络错误，无法查询</p>';
    }
}
</script>
</body>
</html>
