<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 | 南序</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a2b3e; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 2rem; }
        .error-code { font-size: 8rem; font-weight: 800; color: #e67e22; line-height: 1; }
        h1 { font-size: 1.8rem; margin: 1rem 0; }
        p { color: #cbd5e1; margin-bottom: 2rem; }
        a { background: #e67e22; color: white; padding: 0.9rem 2.2rem; border-radius: 40px; text-decoration: none; font-weight: 600; display: inline-block; transition: 0.2s; }
        a:hover { background: #cf711f; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div>
        <div class="error-code">404</div>
        <h1>页面未找到</h1>
        <p>抱歉，您访问的页面不存在或已被移动。</p>
        <a href="/">返回首页 →</a>
    </div>
</body>
</html>
